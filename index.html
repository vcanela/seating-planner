            };
            const switchCls=(id)=>{const cls=loadJSON(CK,{});loadCls(id,cls);};
            const createCls=()=>{const id=genId(),s=makeNew('New Class'),cls=loadJSON(CK,{});cls[id]=s;saveJSON(CK,cls);setClassIndex(p=>({...p,[id]:s.meta.name}));loadCls(id,cls);};
            const dupCls=()=>{const id=genId(),cur=serialize({className,classCreated,rows,cols,selectedSeats:seats,students,constraints,seatingPlan:plan,groupMode:groupBy,groupCount,groupSize,groupRules,inheritApart,groupNames}),copy={...cur,meta:{...cur.meta,name:`${className} (copy)`,created:todayISO(),modified:todayISO()},_lastPlan:null,_lastGroups:null};const cls=loadJSON(CK,{});cls[id]=copy;saveJSON(CK,cls);setClassIndex(p=>({...p,[id]:copy.meta.name}));loadCls(id,cls);};
            const delCls=()=>{if(!window.confirm(`Delete "${className}"?`))return;const cls=loadJSON(CK,{});delete cls[classId];const rem=Object.keys(cls);if(!rem.length){const nid=genId();cls[nid]=makeNew('My Class');rem.push(nid);}saveJSON(CK,cls);setClassIndex(Object.fromEntries(Object.entries(cls).map(([id,c])=>[id,c.meta?.name??'Unnamed'])));loadCls(rem[0],cls);};
            const renameCls=(n)=>{const name=n.trim()||'Unnamed Class';setClassName(name);setClassIndex(p=>({...p,[classId]:name}));};

            // ── Export / Import ──
            const exportCls=()=>{const s=serialize({className,classCreated,rows,cols,selectedSeats:seats,students,constraints,seatingPlan:plan,planDate,groupMode:groupBy,groupCount,groupSize,groupRules,inheritApart,groupNames,groups,groupsDate});delete s._lastPlan;delete s._lastGroups;const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`${className.replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${todayISO()}.json`}).click();markExported([classId]);};
            const exportAll=()=>{const cls=loadJSON(CK,{});const p={version:'1.0',type:'collection',exported:todayISO(),classes:Object.values(cls).map(c=>{const{_lastPlan,...r}=c;return r;})};const b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`all-classes-${todayISO()}.json`}).click();markExported(Object.keys(cls));};
            const importAll=(e)=>{const f=e.target.files[0];if(!f)return;e.target.value='';const r=new FileReader();r.onload=ev=>{try{const newIds=[];const j=JSON.parse(ev.target.result);if(j.type==='collection'&&Array.isArray(j.classes)){const cls=loadJSON(CK,{});const ws=[];let n=0;for(const cd of j.classes){const{data,warnings}=validateImport(cd);const nid=genId();cls[nid]=data;newIds.push(nid);n++;if(warnings.length)ws.push(`${data.meta.name}: ${warnings.join(' ')}`);}saveJSON(CK,cls);markExported(newIds);setClassIndex(Object.fromEntries(Object.entries(cls).map(([id,c])=>[id,c.meta?.name??'Unnamed'])));setImportWarn(ws.length?[`${n} class${n!==1?'es':''} imported:`, ...ws]:[`${n} class${n!==1?'es':''} imported.`]);}else{const{data,warnings}=validateImport(j);const id=genId(),cls=loadJSON(CK,{});cls[id]=data;newIds.push(id);saveJSON(CK,cls);setClassIndex(p=>({...p,[id]:data.meta.name}));setImportWarn(warnings.length?warnings:[`"${data.meta.name}" imported.`]);markExported(newIds);loadCls(id,cls);}}catch{setError('Invalid file.');}};r.readAsText(f);};

            // ── Grid editing ──
            const onSeatDown=(id)=>{if(!editing)return;setDragging(true);const s=new Set(seats);const add=!s.has(id);setDragMode(add);add?s.add(id):s.delete(id);setSeats(s);setPlan(new Map());};
            const onSeatEnter=(id)=>{if(!isDragging||!editing)return;const s=new Set(seats);dragMode?s.add(id):s.delete(id);setSeats(s);};

            // ── Students ──
            const addStudents=(raw)=>{const names=raw.split(/[,;\n]/).map(n=>n.trim()).filter(Boolean);if(!names.length)return;const ex=new Set(students.map(s=>s.name.toLowerCase()));const fresh=names.filter(n=>!ex.has(n.toLowerCase()));setError(fresh.length<names.length?'Duplicates skipped.':'');setStudents(p=>[...p,...fresh.map(name=>({name,id:Date.now()+Math.random()}))]);setPlan(new Map());setGroups(null);};
            const removeStudent=(id)=>{const st=students.find(s=>s.id===id);setStudents(students.filter(s=>s.id!==id));if(st){setCons(constraints.filter(c=>c.student1!==st.name&&c.student2!==st.name));setGroupRules(groupRules.filter(r=>r.student1!==st.name&&r.student2!==st.name));}setPlan(new Map());setGroups(null);};

            // ── Constraints ──
            const addConstraint=()=>{
                if(!cS1||(cType==='separate'&&!cS2)||(cType==='fixed'&&!cSeat))return;
                const nc={id:Date.now(),type:cType,student1:cS1,student2:cType==='separate'?cS2:null,seat:cType==='fixed'?cSeat:undefined};
                const dup=cType==='fixed'
                    ?constraints.some(c=>c.type==='fixed'&&(c.student1===cS1||c.seat===cSeat))
                    :constraints.some(c=>c.type===nc.type&&((c.student1===nc.student1&&c.student2===nc.student2)||(c.type==='separate'&&c.student1===nc.student2&&c.student2===nc.student1)));
                if(!dup){setCons([...constraints,nc]);setCS1('');setCS2('');setCSeat('');setPlan(new Map());}
            };

            // ── Generate ──
            const generate=()=>{
                if(students.length>seats.size)return setError(`Need ${students.length-seats.size} more seats.`);
                if(students.length===0)return setError('Add students first.');
                if(seats.size===0)return setError('Set up the room layout first.');
                let best=null,bestScore=-Infinity;
                for(let i=0;i<200;i++){
                    const avail=[...seats],pool=[...students].sort(()=>Math.random()-0.5),p=new Map();let score=0;
                    for(const req of constraints.filter(c=>c.type==='fixed')){
                        const idx=pool.findIndex(s=>s.name===req.student1);if(idx===-1)continue;
                        if(req.seat&&avail.includes(req.seat)){p.set(req.student1,req.seat);avail.splice(avail.indexOf(req.seat),1);pool.splice(idx,1);}
                    }
                    for(const req of constraints.filter(c=>c.type==='front')){
                        const idx=pool.findIndex(s=>s.name===req.student1);if(idx===-1)continue;
                        const conflicts=constraints.filter(c=>c.type==='separate'&&(c.student1===req.student1||c.student2===req.student1)).map(c=>p.get(c.student1===req.student1?c.student2:c.student1)).filter(Boolean);
                        const sRows=[...new Set(avail.map(id=>parseInt(id.split('-')[0])))].sort((a,b)=>a-b);
                        let chosen=null;
                        for(const row of sRows){const rs=avail.filter(id=>parseInt(id.split('-')[0])===row);const valid=rs.filter(seat=>conflicts.every(cs=>{const[r,c]=seat.split('-').map(Number),[cr,cc]=cs.split('-').map(Number);return Math.sqrt((r-cr)**2+(c-cc)**2)>=1.5;}));if(valid.length){chosen=valid[Math.floor(Math.random()*valid.length)];score+=Math.max(100-row*30,10);break;}}
                        if(!chosen&&avail.length){chosen=avail.reduce((b,id)=>parseInt(id.split('-')[0])<parseInt(b.split('-')[0])?id:b);score-=20;}
                        if(chosen){p.set(pool[idx].name,chosen);avail.splice(avail.indexOf(chosen),1);pool.splice(idx,1);}
                    }
                    for(const s of pool){const idx=Math.floor(Math.random()*avail.length);p.set(s.name,avail[idx]);avail.splice(idx,1);}
                    for(const req of constraints.filter(c=>c.type==='separate')){const s1=p.get(req.student1),s2=p.get(req.student2);if(s1&&s2){const[r1,c1]=s1.split('-').map(Number),[r2,c2]=s2.split('-').map(Number);const d=Math.sqrt((r2-r1)**2+(c2-c1)**2);score+=d<1.5?-100:d<2.5?-20:20;}}
                    if(score>bestScore){bestScore=score;best=p;}
                }
                if(plan&&plan.size>0&&best){let same=0;for(const[n,s]of best.entries())if(plan.get(n)===s)same++;setReshuffleSim(Math.round(((best.size-same)/best.size)*100));}else setReshuffleSim(null);
                setUndoSnap(plan&&plan.size>0?{kind:'seating',plan,planDate}:null);
                setPlan(best);setPlanDate(todayISO());setError('');setEditing(false);
            };

            useEffect(()=>{const all=loadJSON(PK,{});all[classId]=pick;saveJSON(PK,all);},[pick]);

            // ── Random picker ──
            const pickNames=students.map(s=>s.name);
            const pk=pick.date===todayISO()?pick:freshPick(pick);      // guards against the app staying open past midnight
            const awaySet=new Set(pk.away.filter(n=>pickNames.includes(n)));
            const pickedSet=new Set(pk.picked);
            const herePool=pickNames.filter(n=>!awaySet.has(n));                       // everyone here today
            const pickPool=herePool.filter(n=>!pk.noRepeat||!pickedSet.has(n));        // who can be picked next
            const pickShown=(flicker??pk.last).filter(n=>flicker||pickNames.includes(n));
            const poolEmpty=pk.noRepeat&&herePool.length>0&&pickPool.length===0;

            const runPick=()=>{
                if(flicker||!pickPool.length)return;
                const pool=[...pickPool],n=Math.min(pk.count,pool.length);
                for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
                const result=pool.slice(0,n);
                const note=n<pk.count?`Only ${n} left in the pool, so ${n} picked.`:'';
                const commit=()=>{
                    setPick(p=>{const b=p.date===todayISO()?p:freshPick(p);return {...b,last:result,picked:[...b.picked,...result]};});
                    setFlicker(null);setPickNote(note);
                };
                if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){commit();return;}
                // Slot-machine reveal: names flick past quickly, slow down, then land (~1.3s)
                setPickNote('');
                const delays=[45,45,45,50,50,55,60,70,80,95,115,140,175,220];let i=0;
                const tick=()=>{
                    if(i>=delays.length){commit();return;}
                    setFlicker(Array.from({length:n},()=>pickPool[Math.floor(Math.random()*pickPool.length)]));
                    setTimeout(tick,delays[i++]);
                };
                tick();
            };
            // Mark a picked student as away: they leave today's pool, their turn is taken back,
            // and a replacement is drawn into the same slot (if anyone is left).
            const markAway=(slot)=>{
                const name=pickShown[slot];if(!name||flicker)return;
                setPick(p=>{
                    const away=[...p.away.filter(n=>n!==name),name];
                    const picked=[...p.picked];const at=picked.lastIndexOf(name);if(at>=0)picked.splice(at,1);
                    const last=[...p.last];
                    const awayS=new Set(away),pickedS=new Set(picked),others=new Set(last.filter((_,k)=>k!==slot));
                    const cand=pickNames.filter(n=>!awayS.has(n)&&!others.has(n)&&(!p.noRepeat||!pickedS.has(n)));
                    if(cand.length){const r=cand[Math.floor(Math.random()*cand.length)];last[slot]=r;picked.push(r);}
                    else last.splice(slot,1);
                    return {...p,away,picked,last};
                });
                setPickNote('');
            };
            const unAway=(name)=>setPick(p=>({...p,away:p.away.filter(n=>n!==name)}));
            const restartPick=()=>{setPick(p=>({...freshPick(p),away:p.date===todayISO()?p.away:[]}));setPickNote('');};

            // Space bar picks while in Pick mode (handy in Present mode, where the toolbar is hidden)
            const runPickRef=useRef(runPick);runPickRef.current=runPick;
            useEffect(()=>{
                if(mode!=='pick')return;
                const onKey=e=>{
                    if(e.key!==' ')return;
                    if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName))return;
                    e.preventDefault();runPickRef.current();
                };
                window.addEventListener('keydown',onKey);
                return()=>window.removeEventListener('keydown',onKey);
            },[mode]);

            // ── Backup tracking ──
            // Remembers the date each class was last included in an export (or arrived by import).
            // Functional update, because import runs inside a FileReader callback that may hold stale state.
            const markExported=(ids)=>setExported(prev=>{const next={...prev};ids.forEach(id=>next[id]=todayISO());saveJSON('sp_exported',next);return next;});

            // ── Rename a student in place ──
            // Carries the new name through rules, group rules, the current plan and groups.
            // Returns false (and changes nothing) if another student already has that name.
            const renameStudent=(id,raw)=>{
                const st=students.find(s=>s.id===id);if(!st){setEditStu(null);return;}
                const name=raw.trim().slice(0,40);
                if(!name||name===st.name){setEditStu(null);return;}
                if(students.some(s=>s.id!==id&&s.name.toLowerCase()===name.toLowerCase())){setError(`"${name}" is already in the list.`);return false;}
                const old=st.name,sw=n=>n===old?name:n;
                setStudents(students.map(s=>s.id===id?{...s,name}:s));
                setCons(constraints.map(c=>({...c,student1:sw(c.student1),student2:c.student2==null?c.student2:sw(c.student2)})));
                setGroupRules(groupRules.map(r=>({...r,student1:sw(r.student1),student2:sw(r.student2)})));
                if(plan&&plan.size){const p=new Map();for(const[n,seat]of plan.entries())p.set(sw(n),seat);setPlan(p);}
                if(Array.isArray(groups))setGroups(groups.map(g=>g.map(sw)));
                setPick(p=>({...p,picked:p.picked.map(sw),away:p.away.map(sw),last:p.last.map(sw)}));
                if(cS1===old)setCS1(name);if(cS2===old)setCS2(name);if(gS1===old)setGS1(name);if(gS2===old)setGS2(name);
                setEditStu(null);setError('');
            };

            // ── Present mode ──
            // Hides every control and enlarges the content; also asks the browser for full screen.
            // Esc leaves (in full screen the browser handles Esc itself, which we catch via fullscreenchange).
            const enterPresent=()=>{setPresenting(true);setPanelOpen(false);setEditing(false);document.documentElement.requestFullscreen?.().catch(()=>{});};
            const exitPresent=()=>{setPresenting(false);if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});};
            useEffect(()=>{document.body.classList.toggle('presenting',presenting);},[presenting]);
            useEffect(()=>{
                const onKey=e=>{if(e.key==='Escape')setPresenting(false);};
                const onFs=()=>{if(!document.fullscreenElement)setPresenting(false);};
                window.addEventListener('keydown',onKey);document.addEventListener('fullscreenchange',onFs);
                return()=>{window.removeEventListener('keydown',onKey);document.removeEventListener('fullscreenchange',onFs);};
            },[]);

            // ── Undo last reshuffle ──
            const undoReshuffle=()=>{
                if(!undoSnap)return;
                if(undoSnap.kind==='seating'){setPlan(undoSnap.plan);setPlanDate(undoSnap.planDate);}
                else{setGroups(undoSnap.groups);setGroupsDate(undoSnap.groupsDate);}
                setUndoSnap(null);setReshuffleSim(null);
            };
            // Any change to students, desks or rules makes an old plan unsafe to restore, so drop the undo
            // (and the "% changed" message, which no longer describes what's on screen).
            useEffect(()=>{setUndoSnap(null);setReshuffleSim(null);},[students,seats,constraints,rows,cols,groupRules,groupCount,groupSize,groupBy,inheritApart]);

            // ── Mode + Groups ──
            const switchMode=(m)=>{
                setMode(m);setEditing(false);setError('');setReshuffleSim(null);
                if(m==='pick')setPanelTab('students');
                else if(m==='groups'){if(panelTab==='room'||panelTab==='rules')setPanelTab('groups');}
                else{if(panelTab==='groups')setPanelTab('room');}
            };

            const addGroupRule=()=>{
                if(!gS1||!gS2||gS1===gS2)return;
                const dup=groupRules.some(r=>r.type===gType&&((r.student1===gS1&&r.student2===gS2)||(r.student1===gS2&&r.student2===gS1)));
                if(!dup){setGroupRules([...groupRules,{id:Date.now(),type:gType,student1:gS1,student2:gS2}]);setGS1('');setGS2('');setGroups(null);}
            };

            // Seating "Keep Separated" pairs, reused as group "Keep Apart" rules.
            // Skips any pair already added manually on the Groups tab (in either order).
            const inheritedApart=(()=>{
                if(!inheritApart)return[];
                const nameSet=new Set(students.map(s=>s.name));
                const manual=groupRules.filter(r=>r.type==='apart');
                return constraints.filter(c=>c.type==='separate'&&nameSet.has(c.student1)&&nameSet.has(c.student2))
                    .filter(c=>!manual.some(r=>(r.student1===c.student1&&r.student2===c.student2)||(r.student1===c.student2&&r.student2===c.student1)));
            })();

            const shuffleGroups=()=>{
                const names=students.map(s=>s.name);
                if(names.length<2)return setError('Add at least 2 students.');
                const k=groupBy==='size'
                    ?Math.max(1,Math.min(names.length,Math.ceil(names.length/Math.max(1,groupSize))))
                    :Math.max(2,Math.min(groupCount,names.length));
                // union-find: 'together' rules merge students into clusters
                const parent={};names.forEach(n=>parent[n]=n);
                const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
                const union=(a,b)=>{const ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb;};
                groupRules.filter(r=>r.type==='together').forEach(r=>{if(parent[r.student1]!=null&&parent[r.student2]!=null)union(r.student1,r.student2);});
                const clusterMap={};names.forEach(n=>{const root=find(n);(clusterMap[root]=clusterMap[root]||[]).push(n);});
                const clusters=Object.values(clusterMap);
                const apart=[...groupRules.filter(r=>r.type==='apart'),...inheritedApart];
                const apartConflict=(a,b)=>apart.some(r=>(a.includes(r.student1)&&b.includes(r.student2))||(a.includes(r.student2)&&b.includes(r.student1)));
                let best=null,bestScore=-Infinity;
                for(let i=0;i<300;i++){
                    const gs=Array.from({length:k},()=>[]);
                    const order=[...clusters].sort(()=>Math.random()-0.5);
                    let score=0;
                    for(const cl of order){
                        const valid=[];for(let gi=0;gi<k;gi++)if(!apartConflict(cl,gs[gi]))valid.push(gi);
                        let target;
                        if(!valid.length){target=gs.reduce((bi,g,gi,arr)=>g.length<arr[bi].length?gi:bi,0);score-=100;}
                        else{const minSize=Math.min(...valid.map(gi=>gs[gi].length));const pick=valid.filter(gi=>gs[gi].length===minSize);target=pick[Math.floor(Math.random()*pick.length)];}
                        gs[target].push(...cl);
                    }
                    const sizes=gs.map(g=>g.length);score-=(Math.max(...sizes)-Math.min(...sizes))*5;
                    if(score>bestScore){bestScore=score;best=gs;}
                }
                const result=best.map(g=>[...g].sort(()=>Math.random()-0.5));
                setUndoSnap(Array.isArray(groups)&&groups.length?{kind:'groups',groups,groupsDate}:null);
                setGroups(result);setGroupsDate(todayISO());setError('');
            };

            // ── Drag swap ──
            const onDragStart=(e,name,sid)=>{if(editing)return;setDraggedStu({name,fromSeat:sid});e.dataTransfer.effectAllowed='move';};
            const onDragOver=(e)=>{e.preventDefault();e.currentTarget.classList.add('drag-over');};
            const onDragLeave=(e)=>{e.currentTarget.classList.remove('drag-over');};
            const onDrop=(e,tid)=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');if(!draggedStudent)return;const p=new Map(plan);let tn=null;for(const[n,s]of p.entries())if(s===tid)tn=n;p.set(draggedStudent.name,tid);if(tn)p.set(tn,draggedStudent.fromSeat);setPlan(p);setDraggedStu(null);};

            // Rename a group slot. Names stick to the slot, not the students,
            // so they survive a reshuffle. Blank falls back to "Group N".
            const renameGroup=(i,val)=>{
                const next=[...groupNames];
                while(next.length<=i)next.push('');
                next[i]=val.slice(0,40);
                setGroupNames(next);
            };

            // ── Group drag-to-move ──
            const onGroupDragStart=(e,name,from)=>{setDraggedGroupStu({name,from});e.dataTransfer.effectAllowed='move';};
            const onGroupDrop=(e,to)=>{
                e.preventDefault();e.currentTarget.classList.remove('drag-over');
                if(!draggedGroupStu||draggedGroupStu.from===to){setDraggedGroupStu(null);return;}
                const next=groups.map(g=>[...g]);
                next[draggedGroupStu.from]=next[draggedGroupStu.from].filter(n=>n!==draggedGroupStu.name);
                next[to].push(draggedGroupStu.name);
                setGroups(next);setDraggedGroupStu(null);
            };

            // Computed
            const isReady = students.length > 0 && seats.size > 0;

            // Tile width that fits the whole room in the visible area: whichever of width or height runs out first.
            // Subtracts the area's padding (48), the board (68) and the status line (40).
            // Min 68px keeps an 11-letter single word legible at the 9px floor (below that the room scrolls); max 170px.
            const tileW = areaBox.w ? (() => {
                const availW = areaBox.w - 48, availH = areaBox.h - 48 - (presenting ? 80 : 68) - (presenting ? 0 : 40);
                const byW = (availW - SEAT_GAP * (cols - 1)) / cols;
                const byH = ((availH - SEAT_GAP * (rows - 1)) / rows) * SEAT_ASPECT;
                return Math.max(68, Math.min(byW, byH, presenting ? 320 : 170));
            })() : null;
            const hasPlan = plan && plan.size > 0;
            const hasGroups = mode === 'groups' && Array.isArray(groups) && groups.length > 0;

            return (
                <>
                    {presenting && <button className="present-exit no-print" onClick={exitPresent} title="Leave Present mode"><IX/> Exit · Esc</button>}
                    {presenting && mode==='pick' && <button className="present-pick no-print" onClick={runPick} disabled={!pickPool.length||!!flicker}>Pick · Space</button>}

                    {/* ── TOP BAR ── */}
                    <div className="top-bar no-print">
                        <div className="app-title">
                            <div className="logo">
                                <svg width="15" height="13" viewBox="0 0 22 18" fill="white">
                                    <rect x="0" y="0" width="22" height="3" rx="1.5"/>
                                    <rect x="0" y="6" width="6" height="4.5" rx="1.2"/>
                                    <rect x="8" y="6" width="6" height="4.5" rx="1.2"/>
                                    <rect x="16" y="6" width="6" height="4.5" rx="1.2"/>
                                    <rect x="0" y="13" width="6" height="4.5" rx="1.2"/>
                                    <rect x="8" y="13" width="6" height="4.5" rx="1.2"/>
                                    <rect x="16" y="13" width="6" height="4.5" rx="1.2"/>
                                </svg>
                            </div>
                            <span className="app-name">Seating Planner</span>
                        </div>

                        <div className="tb-divider"/>

                        <select className="tb-select" value={classId} onChange={e=>switchCls(e.target.value)}>
                            {Object.entries(classIndex).map(([id,name])=><option key={id} value={id}>{name}</option>)}
                        </select>

                        <div className="tb-divider"/>

                        <div className="mode-toggle">
                            <button className={mode==='seating'?'active':''} onClick={()=>switchMode('seating')}>Seating</button>
                            <button className={mode==='groups'?'active':''} onClick={()=>switchMode('groups')}>Groups</button>
                            <button className={mode==='pick'?'active':''} onClick={()=>switchMode('pick')}>Pick</button>
                        </div>

                        <div className="tb-divider"/>

                        {mode==='pick' ? (
                            <button className="tb-btn tb-btn-primary" onClick={runPick} disabled={!pickPool.length||!!flicker}>
                                <IShuffle/> Pick
                            </button>
                        ) : mode==='groups' ? (
                            <button className="tb-btn tb-btn-primary" onClick={shuffleGroups} disabled={students.length<2}>
                                <IShuffle/> {hasGroups ? <>Reshuffle<span className="tb-label-opt"> Groups</span></> : 'Form Groups'}
                            </button>
                        ) : (
                            <button className="tb-btn tb-btn-primary" onClick={generate} disabled={!isReady}>
                                <IShuffle/> {hasPlan ? 'Reshuffle' : 'Generate'}
                            </button>
                        )}
                        <button className="tb-btn tb-btn-secondary" onClick={()=>window.print()} disabled={mode==='pick'||(mode==='groups'?!hasGroups:!hasPlan)} title="Print">
                            <IPrint/> <span className="tb-label-opt">Print</span>
                        </button>
                        <button className="tb-btn tb-btn-secondary" onClick={enterPresent} disabled={mode==='pick'?!students.length:(mode==='groups'?!hasGroups:!hasPlan)} title="Full screen, controls hidden, names enlarged (Esc to leave)">
                            <IPresent/> <span className="tb-label-opt">Present</span>
                        </button>


                        <div className="tb-spacer"/>

                        {errorMsg && <span style={{fontSize:'0.75rem',color:'#ef4444',fontWeight:600}}>{errorMsg}</span>}

                        <button className={`gear-btn ${panelOpen?'active':''}`} onClick={()=>{setPanelOpen(p=>!p);setEditing(false);}} title="Setup">
                            <IGear/>
                        </button>
                    </div>

                    {/* ── Reshuffle banner ── */}
                    {(()=>{
                        // Shown after a reshuffle: how much changed (seating) plus an Undo for the current mode.
                        const canUndo = undoSnap && mode!=='pick' && ((mode==='groups')===(undoSnap.kind==='groups'));
                        let m = null;
                        if (mode!=='groups' && reshuffleSim !== null)
                            m = reshuffleSim>=65?{t:`${reshuffleSim}% of seats changed`,c:'#166534',bg:'#f0fdf4'}:reshuffleSim>=35?{t:`${reshuffleSim}% changed — moderate variation`,c:'#92400e',bg:'#fffbeb'}:{t:`${reshuffleSim}% changed — constraints limit variation`,c:'#b91c1c',bg:'#fef2f2'};
                        else if (canUndo)
                            m = {t: mode==='groups'?'Groups reshuffled':'Seats reshuffled', c:'#1e40af', bg:'#eff6ff'};
                        if (!m) return null;
                        return <div className="reshuffle-banner no-print" style={{background:m.bg,color:m.c}}>
                            <span>{m.t}</span>
                            {canUndo&&<button className="undo-btn" onClick={undoReshuffle} title="Go back to the arrangement before this reshuffle"><IUndo/> Undo</button>}
                        </div>;
                    })()}

                    {/* ── SETUP PANEL ── */}
                    <div className={`panel-overlay ${panelOpen&&!editing?'open':''}`} onClick={()=>{setPanelOpen(false);setEditing(false);}}/>
                    <div className={`setup-panel ${panelOpen?'open':''}`}>
                        <div className="panel-header">
                            <div className="panel-header-row">
                                <input type="text" className="panel-class-name" value={className} onChange={e=>renameCls(e.target.value)} placeholder="Class name…"/>
                                <button className="panel-close" onClick={()=>{setPanelOpen(false);setEditing(false);}}><IX/></button>
                            </div>
                            <div className="panel-header-row">
                                <select className="field" style={{flex:1,fontSize:'0.75rem',padding:'0.3rem 0.6rem'}} value={classId} onChange={e=>switchCls(e.target.value)}>
                                    {Object.entries(classIndex).map(([id,name])=><option key={id} value={id}>{name}</option>)}
                                </select>
                                <button className="panel-cls-btn" onClick={createCls} title="New class"><IPlus/> New</button>
                                <button className="panel-cls-btn" onClick={dupCls} title="Duplicate"><ICopy/> Copy</button>
                                <button className="panel-cls-btn danger" onClick={delCls} title="Delete"><ITrash/></button>
                            </div>
                        </div>
                        <div className="panel-tabs">
                            {(mode==='pick'?[['students','Students']]:mode==='groups'?[['students','Students'],['groups','Groups']]:[['room','Room'],['students','Students'],['rules','Rules']]).map(([t,label])=>(
                                <button key={t} className={`panel-tab ${panelTab===t?'active':''}`} onClick={()=>{setPanelTab(t);if(t!=='room')setEditing(false);}}>
                                    {label}
                                </button>
                            ))}
                        </div>
                        <div className="panel-body">

                            {/* ─── Room tab ─── */}
                            {panelTab==='room' && (
                                <div className="space-y-4 fade-in">
                                    <label className="field-label">Room Layout</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="field-label">Rows</label>
                                            <input type="number" value={rows} onChange={e=>{setRows(Math.max(2,Math.min(15,Number(e.target.value))));setPlan(new Map());}} className="field" min="2" max="15"/>
                                        </div>
                                        <div>
                                            <label className="field-label">Columns</label>
                                            <input type="number" value={cols} onChange={e=>{setCols(Math.max(2,Math.min(15,Number(e.target.value))));setPlan(new Map());}} className="field" min="2" max="15"/>
                                        </div>
                                    </div>
                                    <button className={`btn ${editing?'btn-primary':'btn-secondary'}`} onClick={()=>setEditing(e=>!e)}>
                                        {editing ? 'Done Editing Layout' : 'Click to Edit Seat Layout'}
                                    </button>
                                    <button className="btn btn-danger" onClick={()=>{if(window.confirm('Clear all seats?')){setSeats(new Set());setPlan(new Map());}}}>
                                        <ITrash/> Clear Grid
                                    </button>
                                    <p style={{fontSize:'0.72rem',color:'#64748b',textAlign:'center'}}>{seats.size} seat{seats.size!==1?'s':''} selected</p>
                                </div>
                            )}

                            {/* ─── Students tab ─── */}
                            {panelTab==='students' && (
                                <div className="space-y-3 fade-in flex flex-col" style={{flex:1,minHeight:0}}>
                                    <div>
                                        <label className="field-label">Add Students</label>
                                        <textarea className="field h-24" placeholder="Names — commas or new lines, then Enter" value={studentInput} onChange={e=>setStudentInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addStudents(studentInput);setStudentInput('');}}}/>
                                        <button className="btn btn-primary mt-2" onClick={()=>{addStudents(studentInput);setStudentInput('');}}>
                                            <IPlus/> Add to List
                                        </button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto rounded-lg border border-slate-200 bg-slate-50" style={{minHeight:'80px'}}>
                                        {students.length===0
                                            ?<p className="text-center py-5 italic" style={{color:'#64748b',fontSize:'0.8rem'}}>No students yet.</p>
                                            :students.map(s=>(
                                                <div key={s.id} className={`student-row group ${editStu?.id===s.id&&editStu.invalid?'invalid':''}`}>
                                                    {editStu?.id===s.id ? (
                                                        <input className="student-edit" autoFocus maxLength={40} value={editStu.text}
                                                            onChange={e=>setEditStu({id:s.id,text:e.target.value,invalid:false})}
                                                            onKeyDown={e=>{
                                                                if(e.key==='Enter'){if(renameStudent(s.id,editStu.text)===false)setEditStu({...editStu,invalid:true});}
                                                                if(e.key==='Escape'){e.stopPropagation();setEditStu(null);setError('');}
                                                            }}
                                                            onBlur={()=>{if(renameStudent(s.id,editStu.text)===false)setEditStu(null);}}/>
                                                    ) : (
                                                        <>
                                                            <span className="truncate flex items-center gap-1.5 student-name" onClick={()=>setEditStu({id:s.id,text:s.name,invalid:false})} title="Click to rename"><IUser/>{s.name}</span>
                                                            <span className="flex items-center gap-1 flex-shrink-0">
                                                                <button className="edit-btn" title="Rename" onClick={()=>setEditStu({id:s.id,text:s.name,invalid:false})}><IPencil/></button>
                                                                <button className="remove-btn" title="Remove" onClick={()=>removeStudent(s.id)}><IX/></button>
                                                            </span>
                                                        </>
                                                    )}
                                                </div>
                                            ))
                                        }
                                    </div>
                                    <div className="flex justify-between text-xs px-1" style={{color:'#64748b'}}>
                                        <span>{students.length} student{students.length!==1?'s':''}</span>
                                        <span>{seats.size} seat{seats.size!==1?'s':''}</span>
                                    </div>
                                    {students.length>0&&<button className="btn btn-danger" onClick={()=>{if(window.confirm('Remove all students?')){setStudents([]);setCons([]);}}}><ITrash/> Clear All</button>}
                                </div>
                            )}

                            {/* ─── Rules tab ─── */}
                            {panelTab==='rules' && (
                                <div className="space-y-4 fade-in">
                                    <label className="field-label">Add Rule</label>
                                    <div className="space-y-3">
                                        <div className="flex gap-2">
                                            <button className={`ctype-card ${cType==='front'?'active':''}`} onClick={()=>{setCType('front');setCS1('');setCS2('');setCSeat('');}}>
                                                <div className="ctype-icon"><IFront/></div><span className="ctype-title">Sit at Front</span><span className="ctype-sub">1 student</span>
                                            </button>
                                            <button className={`ctype-card ${cType==='separate'?'active':''}`} onClick={()=>{setCType('separate');setCS1('');setCS2('');setCSeat('');}}>
                                                <div className="ctype-icon"><IApart/></div><span className="ctype-title">Keep Separated</span><span className="ctype-sub">2 students</span>
                                            </button>
                                            <button className={`ctype-card ${cType==='fixed'?'active':''}`} onClick={()=>{setCType('fixed');setCS1('');setCS2('');setCSeat('');}}>
                                                <div className="ctype-icon"><IPin/></div><span className="ctype-title">Fixed Seat</span><span className="ctype-sub">exact seat</span>
                                            </button>
                                        </div>
                                        <select className="field" value={cS1} onChange={e=>setCS1(e.target.value)}>
                                            <option value="">{cType==='separate'?'Student 1…':'Select student…'}</option>
                                            {students.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                        </select>
                                        {cType==='separate'&&<select className="field" value={cS2} onChange={e=>setCS2(e.target.value)} disabled={!cS1}>
                                            <option value="">Student 2…</option>
                                            {students.filter(s=>s.name!==cS1).map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                        </select>}
                                        {cType==='fixed'&&<select className="field" value={cSeat} onChange={e=>setCSeat(e.target.value)} disabled={!cS1}>
                                            <option value="">Pick a seat…</option>
                                            {[...seats].sort((a,b)=>{const[ar,ac]=a.split('-').map(Number),[br,bc]=b.split('-').map(Number);return ar-br||ac-bc;}).filter(id=>!constraints.some(c=>c.type==='fixed'&&c.seat===id)).map(id=>{const[r,c]=id.split('-').map(Number);return <option key={id} value={id}>Row {r+1}, Seat {c+1}</option>;})}
                                        </select>}
                                        <button className="btn btn-secondary" onClick={addConstraint} disabled={!cS1||(cType==='separate'&&!cS2)||(cType==='fixed'&&!cSeat)}><IPlus/> Add Rule</button>
                                    </div>

                                    {/* Flexibility */}
                                    {students.length>0&&constraints.length>0&&(()=>{
                                        const con=new Set(constraints.flatMap(c=>c.type==='separate'?[c.student1,c.student2]:[c.student1]));
                                        const r=con.size/students.length,pct=Math.round(r*100);
                                        const b=r<0.35?{l:'Good variation',c:'#22c55e',t:'rgba(34,197,94,0.15)'}:r<0.65?{l:'Moderate',c:'#eab308',t:'rgba(234,179,8,0.15)'}:{l:'Limited',c:'#ef4444',t:'rgba(239,68,68,0.15)'};
                                        return(<div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'0.6rem 0.8rem'}}>
                                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.68rem',marginBottom:'0.35rem'}}><span style={{fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:'#64748b'}}>Flexibility</span><span style={{fontWeight:600,color:b.c}}>{b.l}</span></div>
                                            <div style={{height:'4px',borderRadius:'99px',background:b.t,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,background:b.c,borderRadius:'99px',transition:'width 0.4s ease'}}/></div>
                                            <p style={{fontSize:'0.65rem',color:'#475569',marginTop:'0.3rem'}}>{con.size} of {students.length} constrained ({pct}%)</p>
                                        </div>);
                                    })()}

                                    {/* Active constraints */}
                                    {constraints.length>0&&(
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <label className="field-label mb-0">Active</label>
                                                <button onClick={()=>setHideC(h=>!h)} className="flex items-center gap-1 text-xs px-2 py-1 rounded-md transition-all" style={{background:hideC?'#fffbeb':'#fff',border:hideC?'1px solid #fde68a':'1px solid #e2e8f0',color:hideC?'#92400e':'#64748b'}}>
                                                    {hideC?<><IEye/> Reveal</>:<><IEyeOff/> Hide</>}
                                                </button>
                                            </div>
                                            {hideC?<div className="chip justify-center" style={{borderColor:'#fde68a',background:'#fffbeb',color:'#92400e'}}><span className="text-xs">Constraints are set</span></div>:(
                                                <>
                                                    {constraints.some(c=>c.type==='front')&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><IFront size={12}/> Front</span></p>{constraints.filter(c=>c.type==='front').map(c=><div key={c.id} className="chip"><strong>{c.student1}</strong><button onClick={()=>setCons(constraints.filter(x=>x.id!==c.id))} style={{color:'#f87171',fontWeight:700,marginLeft:'0.5rem',fontSize:'1rem',lineHeight:1,border:'none',background:'none',cursor:'pointer'}}>×</button></div>)}</div>}
                                                    {constraints.some(c=>c.type==='separate')&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><IApart size={12}/> Separated</span></p>{constraints.filter(c=>c.type==='separate').map(c=><div key={c.id} className="chip"><span><strong>{c.student1}</strong><span style={{color:'#64748b',margin:'0 0.25rem'}}>+</span><strong>{c.student2}</strong></span><button onClick={()=>setCons(constraints.filter(x=>x.id!==c.id))} style={{color:'#f87171',fontWeight:700,marginLeft:'0.5rem',fontSize:'1rem',lineHeight:1,border:'none',background:'none',cursor:'pointer'}}>×</button></div>)}</div>}
                                                    {constraints.some(c=>c.type==='fixed')&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><IPin size={12}/> Fixed seat</span></p>{constraints.filter(c=>c.type==='fixed').map(c=>{const[r,cc]=(c.seat||'').split('-').map(Number);return <div key={c.id} className="chip"><span><strong>{c.student1}</strong><span style={{color:'#64748b',margin:'0 0.25rem'}}>→</span>{isNaN(r)?'—':`Row ${r+1}, Seat ${cc+1}`}</span><button onClick={()=>setCons(constraints.filter(x=>x.id!==c.id))} style={{color:'#f87171',fontWeight:700,marginLeft:'0.5rem',fontSize:'1rem',lineHeight:1,border:'none',background:'none',cursor:'pointer'}}>×</button></div>;})}</div>}
                                                </>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* ─── Groups tab ─── */}
                            {panelTab==='groups' && (
                                <div className="space-y-4 fade-in">
                                    <div>
                                        <label className="field-label">Grouping</label>
                                        <div className="gseg">
                                            <button className={groupBy==='count'?'active':''} onClick={()=>{setGroupBy('count');setGroups(null);}}>Number of groups</button>
                                            <button className={groupBy==='size'?'active':''} onClick={()=>{setGroupBy('size');setGroups(null);}}>Students per group</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="field-label">{groupBy==='count'?'Number of Groups':'Students per Group'}</label>
                                        {groupBy==='count'
                                            ?<Stepper value={groupCount} min={2} max={Math.max(2,students.length)} onChange={v=>{setGroupCount(v);setGroups(null);}}/>
                                            :<Stepper value={groupSize} min={2} max={Math.max(2,students.length)} onChange={v=>{setGroupSize(v);setGroups(null);}}/>}
                                        <p style={{fontSize:'0.68rem',color:'#475569',marginTop:'0.4rem'}}>
                                            {students.length<1?'Add students first.':groupBy==='count'
                                                ?`${students.length} students → about ${Math.ceil(students.length/Math.max(2,Math.min(groupCount,students.length)))} per group`
                                                :`${students.length} students → ${Math.max(1,Math.ceil(students.length/Math.max(1,groupSize)))} group${Math.ceil(students.length/Math.max(1,groupSize))!==1?'s':''}`}
                                        </p>
                                    </div>
                                    <div className="divider"/>
                                    <label className={`inherit-row ${inheritApart?'on':''}`}>
                                        <input type="checkbox" checked={inheritApart} onChange={e=>{setInheritApart(e.target.checked);setGroups(null);}}/>
                                        <span>
                                            <span className="it">Use seating's “Keep Separated” pairs</span>
                                            <span className="is">
                                                {constraints.filter(c=>c.type==='separate').length===0
                                                    ?'No separated pairs set in Seating yet — any you add there will apply here automatically.'
                                                    :`${constraints.filter(c=>c.type==='separate').length} pair${constraints.filter(c=>c.type==='separate').length!==1?'s':''} from Seating — these students are also kept in different groups.`}
                                            </span>
                                        </span>
                                    </label>
                                    <label className="field-label">Add Group Rule</label>
                                    <div className="space-y-3">
                                        <div className="flex gap-2">
                                            <button className={`ctype-card ${gType==='together'?'active':''}`} onClick={()=>{setGType('together');setGS1('');setGS2('');}}>
                                                <div className="ctype-icon"><ITogether/></div><span className="ctype-title">Same Group</span><span className="ctype-sub">together</span>
                                            </button>
                                            <button className={`ctype-card ${gType==='apart'?'active':''}`} onClick={()=>{setGType('apart');setGS1('');setGS2('');}}>
                                                <div className="ctype-icon"><IApart/></div><span className="ctype-title">Keep Apart</span><span className="ctype-sub">different groups</span>
                                            </button>
                                        </div>
                                        <select className="field" value={gS1} onChange={e=>setGS1(e.target.value)}>
                                            <option value="">Student 1…</option>
                                            {students.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                        </select>
                                        <select className="field" value={gS2} onChange={e=>setGS2(e.target.value)} disabled={!gS1}>
                                            <option value="">Student 2…</option>
                                            {students.filter(s=>s.name!==gS1).map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                        </select>
                                        <button className="btn btn-secondary" onClick={addGroupRule} disabled={!gS1||!gS2}><IPlus/> Add Rule</button>
                                    </div>

                                    {(groupRules.length>0||inheritedApart.length>0)&&(
                                        <div className="space-y-2">
                                            <label className="field-label mb-0">Active</label>
                                            {groupRules.some(r=>r.type==='together')&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><ITogether size={12}/> Same group</span></p>{groupRules.filter(r=>r.type==='together').map(r=><div key={r.id} className="chip"><span><strong>{r.student1}</strong><span style={{color:'#64748b',margin:'0 0.25rem'}}>+</span><strong>{r.student2}</strong></span><button onClick={()=>{setGroupRules(groupRules.filter(x=>x.id!==r.id));setGroups(null);}} style={{color:'#f87171',fontWeight:700,marginLeft:'0.5rem',fontSize:'1rem',lineHeight:1,border:'none',background:'none',cursor:'pointer'}}>×</button></div>)}</div>}
                                            {groupRules.some(r=>r.type==='apart')&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><IApart size={12}/> Keep apart</span></p>{groupRules.filter(r=>r.type==='apart').map(r=><div key={r.id} className="chip"><span><strong>{r.student1}</strong><span style={{color:'#64748b',margin:'0 0.25rem'}}>/</span><strong>{r.student2}</strong></span><button onClick={()=>{setGroupRules(groupRules.filter(x=>x.id!==r.id));setGroups(null);}} style={{color:'#f87171',fontWeight:700,marginLeft:'0.5rem',fontSize:'1rem',lineHeight:1,border:'none',background:'none',cursor:'pointer'}}>×</button></div>)}</div>}
                                            {inheritedApart.length>0&&<div className="space-y-1"><p className="text-xs font-semibold uppercase tracking-wider px-1" style={{color:'#475569'}}><span className="rule-head"><IApart size={12}/> Keep apart · from Seating</span></p>{inheritedApart.map(c=><div key={`inh-${c.id}`} className="chip inherited" title="Set on the Seating Rules tab"><span><strong>{c.student1}</strong><span style={{color:'#64748b',margin:'0 0.25rem'}}>/</span><strong>{c.student2}</strong></span><span style={{fontSize:'0.62rem',color:'#64748b',marginLeft:'0.5rem'}}>inherited</span></div>)}<p style={{fontSize:'0.62rem',color:'#475569',padding:'0 0.25rem'}}>Edit these on the Seating → Rules tab.</p></div>}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                        {importWarn.length>0&&(
                            <div style={{padding:'0 1.2rem 0.5rem'}}>
                                <div className="import-warning">
                                    <div className="flex justify-between items-start mb-1">
                                        <strong>{importWarn[0]}</strong>
                                        <button onClick={()=>setImportWarn([])} style={{color:'#92400e',background:'none',border:'none',cursor:'pointer',fontWeight:700,fontSize:'1rem'}}>×</button>
                                    </div>
                                    {importWarn.length>1&&<ul style={{listStyle:'disc',marginLeft:'1rem'}}>{importWarn.slice(1).map((w,i)=><li key={i}>{w}</li>)}</ul>}
                                </div>
                            </div>
                        )}
                        {students.length>0&&(()=>{
                            // How long since this class was last exported; amber when never, or 30+ days.
                            const last=exported[classId];
                            const days=last?Math.round((new Date(todayISO()+'T00:00:00')-new Date(last+'T00:00:00'))/864e5):null;
                            const when=days===null?null:days<=0?'today':days===1?'yesterday':days<14?`${days} days ago`:`${Math.floor(days/7)} weeks ago`;
                            const stale=days===null||days>=30;
                            return <div className={`backup-note ${stale?'stale':''}`} title="Export keeps a backup file. Classes live only in this browser, so clearing it would lose them.">
                                <IExport/>{days===null?'This class hasn’t been backed up yet':`Backed up ${when}`}
                            </div>;
                        })()}
                        <div className="panel-footer">
                            <button className="panel-footer-btn" onClick={exportCls}><IExport/> Export class</button>
                            <button className="panel-footer-btn" onClick={exportAll}><IExport/> All classes</button>
                            <label className="panel-footer-btn" style={{cursor:'pointer'}}><IUpload/> Import<input type="file" onChange={importAll} className="hidden" accept=".json"/></label>
                        </div>
                    </div>

                    {/* ── GRID AREA ── */}
                    <div ref={areaRef} className={`grid-area ${mode==='seating'&&(isReady||editing)?'seat-view':''}`} style={{marginLeft: panelOpen ? '390px' : '0', transition: 'margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1)'}}>
                        {mode==='pick' ? (
                            students.length===0 ? (
                                <div className="empty-state">
                                    <h3>Add students</h3>
                                    <p>Add your class on the Students tab to start picking.</p>
                                    <button onClick={()=>{setPanelOpen(true);setPanelTab('students');}}><IGear/> Open Setup</button>
                                </div>
                            ) : (
                                <div className="pick-wrap">
                                    <div className="pick-controls no-print">
                                        <div className="pick-count">
                                            <span className="pick-label">How many</span>
                                            <Stepper value={pk.count} min={1} max={Math.max(1,students.length)} onChange={v=>setPick(p=>({...p,count:v}))}/>
                                        </div>
                                        <label className="pick-norepeat">
                                            <input type="checkbox" checked={pk.noRepeat} onChange={e=>setPick(p=>({...p,noRepeat:e.target.checked}))}/>
                                            Don't repeat until everyone's had a turn
                                        </label>
                                        <div className="pick-status">
                                            <span className="pick-pool">
                                                {pk.noRepeat?`${pickPool.length} of ${herePool.length} left`:`${herePool.length} to choose from`}{awaySet.size>0?` · ${awaySet.size} away`:''}
                                            </span>
                                            {pk.picked.length>0&&<button className="pick-restart" onClick={restartPick} title="Put everyone back in the pool">Start again</button>}
                                        </div>
                                    </div>

                                    <div className="pick-stage">
                                        {pickShown.length ? pickShown.map((n,k)=>{
                                            const c=pickShown.length;
                                            const size=c===1?'clamp(2.6rem,7vw,6.5rem)':c<=3?'clamp(1.9rem,4.6vw,4.2rem)':c<=6?'clamp(1.5rem,3.2vw,3rem)':'clamp(1.15rem,2.2vw,2.1rem)';
                                            return (
                                                <div key={flicker?`f${k}`:`${k}-${n}`} className={`pick-card ${flicker?'spinning':'landed'}`}>
                                                    {c>1&&<span className="pick-num">{k+1}</span>}
                                                    <span className="pick-name" style={{fontSize:size}}>{n}</span>
                                                    {!flicker&&<button className="pick-away no-print" onClick={()=>markAway(k)} title="Not here today: pick someone else instead">Away</button>}
                                                </div>
                                            );
                                        }) : poolEmpty ? (
                                            <div className="pick-empty">
                                                <h3>Everyone has had a turn</h3>
                                                <button onClick={restartPick}>Start again</button>
                                            </div>
                                        ) : (
                                            <div className="pick-empty">Press <strong>Pick</strong>{presenting?' or the space bar':''} to choose {pk.count===1?'a student':`${pk.count} students`}.</div>
                                        )}
                                    </div>
                                    {pickNote&&<p className="pick-note">{pickNote}</p>}
                                    {poolEmpty&&pickShown.length>0&&!flicker&&(
                                        <p className="pick-note" style={{color:'#166534'}}>Everyone has now had a turn. <button className="pick-restart" style={{marginLeft:'0.5rem'}} onClick={restartPick}>Start again</button></p>
                                    )}

                                    {(pk.picked.length>0||awaySet.size>0)&&(
                                        <div className="pick-meta no-print">
                                            {pk.picked.length>0&&<div>
                                                <span className="pick-meta-label">Picked so far</span>
                                                <div className="pick-chips">{pk.picked.filter(n=>pickNames.includes(n)).map((n,k)=><span key={k} className="pick-chip">{k+1}. {n}</span>)}</div>
                                            </div>}
                                            {awaySet.size>0&&<div>
                                                <span className="pick-meta-label">Away today</span>
                                                <div className="pick-chips">{[...awaySet].map(n=><span key={n} className="pick-chip away">{n}<button onClick={()=>unAway(n)} title="They're here after all: put them back in the pool">×</button></span>)}</div>
                                            </div>}
                                        </div>
                                    )}
                                </div>
                            )
                        ) : mode==='groups' ? (
                            students.length<2 ? (
                                <div className="empty-state">
                                    <h3>Add students</h3>
                                    <p>Add at least 2 students to start forming groups.</p>
                                    <button onClick={()=>{setPanelOpen(true);setPanelTab('students');}}><IGear/> Open Setup</button>
                                </div>
                            ) : (
                                <div className="groups-wrap" style={{width:'100%',maxWidth:'960px'}}>
                                    <div className="print-only print-header">
                                        <span className="print-class-name">{className} — Groups</span>
                                        <span className="print-date">{groupsDate?`Grouped ${fmtDate(groupsDate)}`:''}</span>
                                    </div>
                                    {hasGroups ? (
                                        <>
                                            <div className="groups-grid">
                                                {groups.map((g,i)=>{const[c1,c2]=GROUP_COLORS[i%GROUP_COLORS.length];return(
                                                    <div key={i} className="group-card"
                                                        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over');}}
                                                        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
                                                        onDrop={e=>onGroupDrop(e,i)}>
                                                        <div className="group-card-header" style={{background:`linear-gradient(135deg, ${c1}, ${c2})`}}>
                                                            <input className="group-name-input no-print" type="text" maxLength={40}
                                                                value={groupNames[i]||''} placeholder={`Group ${i+1}`}
                                                                onChange={e=>renameGroup(i,e.target.value)}
                                                                onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
                                                                title="Click to name this group"/>
                                                            <span className="print-only group-name-print">{groupNames[i]||`Group ${i+1}`}</span>
                                                            <span className="group-count">{g.length}</span>
                                                        </div>
                                                        <div className="group-members">
                                                            {g.length?g.map((n,j)=><div key={j} className="group-member" draggable onDragStart={e=>onGroupDragStart(e,n,i)} title="Drag to another group">{n}</div>):<div className="group-member" style={{color:'#94a3b8',fontStyle:'italic',cursor:'default'}}>—</div>}
                                                        </div>
                                                    </div>
                                                );})}
                                            </div>
                                            <div className="no-print status-line" style={{textAlign:'center',marginTop:'1rem',fontSize:'0.78rem',color:'#64748b'}}>
                                                {groups.length} group{groups.length!==1?'s':''} · {students.length} students{groupsDate&&<> · <span style={{color:'#334155',fontWeight:600}}>Grouped {fmtDate(groupsDate)}</span></>} · Drag a name to move it
                                            </div>
                                        </>
                                    ) : (
                                        <div className="empty-state">
                                            <h3>Ready to group</h3>
                                            <p>{students.length} students into {Math.max(2,Math.min(groupCount,students.length))} groups. Press <strong>Form Groups</strong>.</p>
                                        </div>
                                    )}
                                </div>
                            )
                        ) : (
                        !isReady && !editing ? (
                            <div className="empty-state">
                                <h3>Get started</h3>
                                <p>Set up your room layout and add students to generate a seating plan.</p>
                                <button onClick={()=>{setPanelOpen(true);setPanelTab(seats.size===0?'room':'students');}}>
                                    <IGear/> Open Setup
                                </button>
                            </div>
                        ) : (
                            <div className="seat-wrap" style={tileW?{width:`${tileW*cols+SEAT_GAP*(cols-1)}px`}:{maxWidth:'960px'}}>
                                <div className="print-only print-header">
                                    <span className="print-class-name">{className}</span>
                                    <span className="print-date">{planDate?`Seating set ${fmtDate(planDate)}`:''}</span>
                                </div>
                                <div className="board">Board / Front of Class</div>
                                <div className="seating-grid" style={{'--cols':cols,gridTemplateColumns:tileW?`repeat(${cols}, ${tileW}px)`:`repeat(${cols}, minmax(0, 1fr))`}} onMouseLeave={()=>setDragging(false)}>
                                    {Array.from({length:rows*cols}).map((_,idx)=>{
                                        const r=Math.floor(idx/cols),c=idx%cols,id=`${r}-${c}`,isSel=seats.has(id);

                                        // Editing mode — paint seats
                                        if(editing) return(
                                            <div key={id} onMouseDown={()=>onSeatDown(id)} onMouseEnter={()=>onSeatEnter(id)} className={`seat cursor-pointer ${isSel?'selected':'empty'}`}>
                                                {isSel&&<span style={{fontSize:'0.55rem',opacity:0.7}}>{r+1},{c+1}</span>}
                                            </div>
                                        );

                                        // Not a seat
                                        if(!isSel) return <div key={id} className="seat not-available"/>;

                                        // Find student
                                        let name=null;
                                        if(plan)for(const[n,s]of plan.entries())if(s===id){name=n;break;}

                                        return(
                                            <div key={id} className={`seat ${name?'assigned':'open'}`} draggable={!!name} onDragStart={e=>onDragStart(e,name,id)} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,id)} title={name||''}>
                                                {name&&<span className="nm" style={{'--fit':nameFit(name)}}>{name}</span>}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="no-print status-line" style={{textAlign:'center',marginTop:'1rem',fontSize:'0.78rem',color:'#64748b'}}>
                                    {editing&&`${seats.size} of ${rows*cols} seats selected`}
                                    {!editing&&hasPlan&&<>{plan.size} student{plan.size!==1?'s':''} placed{planDate&&<> · <span style={{color:'#334155',fontWeight:600}}>Seating set {fmtDate(planDate)}</span></>} · Drag names to swap</>}
                                    {!editing&&!hasPlan&&isReady&&'Ready — press Generate'}
                                </div>
                            </div>
                        )
                        )}
                    </div>
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
